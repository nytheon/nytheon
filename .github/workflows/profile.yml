name: refresh profile

on:
  schedule:
    - cron: 0 2 * * *
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        working-directory: profile-builder
        run: python -m unittest discover -s tests -v
      - name: Generate profile
        working-directory: profile-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python -m profile_builder --root ..
      - name: Commit and push
        env:
          BOT_NAME: Nytheon
          BOT_EMAIL: henrik.weber63@gmail.com
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile [skip ci]"
          git push
